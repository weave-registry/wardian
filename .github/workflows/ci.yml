# CI for Wardian (ADR-2610082000): the right tests at the right moment.
#
#   every push to main        fast: cargo test, hexa, the install test (a few minutes)
#   pull requests, releases,  fast, then every browser suite, each on its own runner at once,
#   by hand                   and the Splunk and Make-an-app suites again through a fake Bedrock
#   every night, or by hand   all of that and the load test
#
# A release (release.yml) calls this workflow and builds nothing until every suite passes.
#
# hexa (https://github.com/gaberger/hexa) is downloaded from its GitHub release, checked against
# its SHA256SUMS.txt, at the version HEXA_VERSION names. The fast checks run `hexa analyze . --grade
# A` and `hexa adr doctor`; the full set runs `hexa adr gates`, every ADR's gate, on a runner with
# Chromium and the WebAssembly target, since some gates are browser tests.
#
# The checks against real services (tests/live/) are not run here: they need credentials and are
# run by hand once per release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      load:
        description: Also run the load test
        type: boolean
        default: false
  workflow_call:
    inputs:
      suites:
        description: Run every browser suite after the fast checks
        type: boolean
        default: true

permissions:
  contents: read

env:
  HEXA_VERSION: "26.9.12"
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  WARDIAN_NO_OPEN: "1"
  # The suites launch Google Chrome by default; on the runner they use Playwright's Chromium.
  WARDIAN_BROWSER: chromium

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: cargo test --release
        run: cargo test --release

      - name: Install hexa
        run: |
          set -euo pipefail
          tarball="hexa-$HEXA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/gaberger/hexa/releases/download/v$HEXA_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/SHA256SUMS.txt"
          grep " $tarball\$" SHA256SUMS.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" hexa
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: hexa analyze . --grade A
        run: hexa analyze . --grade A

      - name: hexa adr doctor
        run: hexa adr doctor

      - name: The install test
        run: tests/run-install-e2e.sh

  # The browser suites to run, one per runner: every tests/run-*-e2e.sh but the install test (in
  # fast) and the load test (nightly), and the two that also run through a fake Amazon Bedrock.
  list:
    if: github.event_name != 'push' || inputs.suites
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          {
            for r in tests/run-*-e2e.sh; do
              case "$r" in tests/run-install-e2e.sh|tests/run-load-e2e.sh) continue ;; esac
              printf '{"runner":"%s","provider":"anthropic"}\n' "$r"
            done
            for r in tests/run-splunk-e2e.sh tests/run-background-e2e.sh; do
              printf '{"runner":"%s","provider":"bedrock"}\n' "$r"
            done
          } | python3 -c 'import json,sys; print("suites=" + json.dumps([json.loads(l) for l in sys.stdin]))' >> "$GITHUB_OUTPUT"

  suites:
    needs: [fast, list]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.list.outputs.suites) }}
    name: ${{ matrix.suite.runner }} (${{ matrix.suite.provider }})
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: suites

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright
          npx --yes playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: ${{ matrix.suite.runner }}
        run: PROVIDER=${{ matrix.suite.provider }} ${{ matrix.suite.runner }}

  # Every ADR's gate (hexa adr gates). Some gates are browser tests and one builds WebAssembly.
  gates:
    needs: fast
    if: github.event_name != 'push' || inputs.suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: suites

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright
          npx --yes playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Install hexa
        run: |
          set -euo pipefail
          tarball="hexa-$HEXA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/gaberger/hexa/releases/download/v$HEXA_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/SHA256SUMS.txt"
          grep " $tarball\$" SHA256SUMS.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" hexa
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: hexa adr gates
        run: hexa adr gates --verbose

  load:
    needs: fast
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.load)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        suite: [{ runner: tests/run-load-e2e.sh, provider: anthropic }]
    name: tests/run-load-e2e.sh
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: suites

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright
          npx --yes playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: ${{ matrix.suite.runner }}
        run: PROVIDER=${{ matrix.suite.provider }} ${{ matrix.suite.runner }}
