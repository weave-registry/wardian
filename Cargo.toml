[package]
name = "rustle"
version = "0.3.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
