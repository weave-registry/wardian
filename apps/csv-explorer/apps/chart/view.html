<h2>Chart</h2>
<div class="w-field chart-pick" id="pickBox" hidden>
  <label class="w-label" for="col">Count rows by</label>
  <select class="w-input" id="col"></select>
</div>
<p class="note" id="caption"></p>
<p class="readout" id="readout" aria-live="polite"></p>
<div id="plot" class="plot"><p class="empty">Waiting for data.</p></div>
<details class="as-table" id="asTable" hidden>
  <summary>Show as a table</summary>
  <div id="tableOut"></div>
</details>
