<h2>Rows</h2>
<div class="w-field filter" id="filterBox" hidden>
  <label class="w-label" for="find">Filter</label>
  <input class="w-input" type="search" id="find" spellcheck="false" autocomplete="off" placeholder="For example: europe population>1000000">
  <p class="w-hint" id="findHint"></p>
</div>
<div id="out"><p class="empty">Waiting for data.</p></div>
<div class="pager" id="pager" hidden>
  <button class="w-button" data-variant="outline" data-size="sm" id="first" type="button" aria-label="First page">«</button>
  <button class="w-button" data-variant="outline" data-size="sm" id="prev" type="button">Previous</button>
  <span id="pageInfo" role="status"></span>
  <button class="w-button" data-variant="outline" data-size="sm" id="next" type="button">Next</button>
  <button class="w-button" data-variant="outline" data-size="sm" id="last" type="button" aria-label="Last page">»</button>
</div>
