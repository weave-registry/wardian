<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image lab</title>
<!-- The Wardian component library (wardian add button field card badge switch toast arrange type surface). -->
<link rel="stylesheet" href="ui/theme.css">
<link rel="stylesheet" href="ui/button.css">
<link rel="stylesheet" href="ui/field.css">
<link rel="stylesheet" href="ui/card.css">
<link rel="stylesheet" href="ui/badge.css">
<link rel="stylesheet" href="ui/switch.css">
<link rel="stylesheet" href="ui/toast.css">
<link rel="stylesheet" href="ui/type.css">
<link rel="stylesheet" href="ui/surface.css">
<style>
  :root { color-scheme: light dark; --page: #f7f7f8; --checker: #e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --page: #111113; --checker: #27272a; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--w-space-5) clamp(16px, 3vw, 32px); font: var(--w-text-lg)/1.5 var(--w-font); color: var(--w-fg); background: var(--page); }
  .top { margin-bottom: var(--w-space-4); }
  .top p { margin: 10px 0 0; }
  h2 { margin: 0 0 var(--w-space-3); font: 600 var(--w-text-lg)/1.3 var(--w-font); }
  /* Two columns that Arrange may swap, join, or fill differently. */
  .layout { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: var(--w-space-4); align-items: start; }
  .col { display: flex; flex-direction: column; gap: var(--w-space-4); min-width: 0; }
  .col[hidden] { display: none; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel { padding: var(--w-space-4) var(--w-space-5); }
  .panel.view { padding: var(--w-space-3); }
  .btnrow { display: flex; flex-wrap: wrap; gap: var(--w-space-2); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--w-space-2); }
  .grid2 .w-button { width: 100%; }
  input[type=range] { width: 100%; accent-color: var(--w-primary); }
  .range-row { display: flex; align-items: center; gap: var(--w-space-3); }
  .range-row output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--w-muted); font-size: var(--w-text-sm); }
  .params[hidden] { display: none; }
  .note { margin: 0 0 var(--w-space-3); color: var(--w-muted); font-size: var(--w-text-sm); }
  .drop { display: grid; place-items: center; gap: var(--w-space-2); padding: var(--w-space-4); margin-bottom: var(--w-space-3); text-align: center;
    border: 2px dashed var(--w-glass-edge, var(--w-border)); border-radius: var(--w-radius); color: var(--w-muted); font-size: var(--w-text-sm); }
  .drop.over, body.dragging .drop { border-color: var(--w-primary); color: var(--w-fg); }
  .file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file:focus-visible + label { outline: 2px solid var(--w-ring); outline-offset: 2px; }
  /* The picture: the "after" canvas, with the "before" canvas on top, cut off at the divider. */
  .stage { position: relative; margin: 0 auto; max-width: 100%; max-height: 74vh; border-radius: var(--w-radius); overflow: hidden; touch-action: none;
    background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 20px 20px; cursor: ew-resize; user-select: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage .before { clip-path: inset(0 calc(100% - var(--split, 50%)) 0 0); }
  .stage .divider { position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
  .stage .divider::after { content: "◀ ▶"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 4px 8px; border-radius: 999px;
    background: #fff; color: #18181b; font: 600 11px/1 var(--w-font); letter-spacing: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.35); white-space: nowrap; }
  .stage .tag { position: absolute; top: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font: 600 11px/1.6 var(--w-font); pointer-events: none; }
  .stage .tag.l { left: 8px; } .stage .tag.r { right: 8px; }
  .stage.whole { cursor: default; }
  .stage.whole .before, .stage.whole .divider, .stage.whole .tag { display: none; }
  .viewbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--w-space-3); padding: var(--w-space-3) var(--w-space-2) var(--w-space-1); }
  .viewbar .split-range { flex: 1; min-width: 160px; max-width: 360px; }
  .info { color: var(--w-muted); font: 12.5px/1.5 var(--w-font-mono); }
  .hist { display: block; width: 100%; height: 140px; border-radius: var(--w-radius); background: color-mix(in srgb, var(--w-fg) 7%, transparent); }
  .legend { display: flex; gap: var(--w-space-3); margin-top: var(--w-space-2); color: var(--w-muted); font-size: var(--w-text-sm); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .steps { margin: 0 0 var(--w-space-3); padding-left: 1.4em; color: var(--w-muted); font-size: var(--w-text-sm); max-height: 10.5em; overflow: auto; }
  .steps:empty::before { content: "No changes yet."; margin-left: -1.4em; }
  .pending { margin-bottom: var(--w-space-3); }
  .pending[hidden] { display: none; }
</style>
<body class="w-wallpaper">
<header class="top">
  <h1 class="w-display">Image lab</h1>
  <p class="w-lede">Photo filters in WebAssembly. Your picture never leaves this computer.</p>
</header>
<main class="layout" data-arrange-grid>
  <div class="col" data-arrange-column="side">
    <section class="w-card w-glass panel" data-panel="open" data-panel-label="Open a picture">
      <h2>Open a picture</h2>
      <div class="drop" id="drop">
        <span>Drop a picture here, or</span>
        <input class="file" type="file" id="file" accept="image/*">
        <label class="w-button" data-variant="outline" for="file">Choose a file…</label>
      </div>
      <div class="btnrow"><button class="w-button" data-variant="ghost" data-size="sm" id="sample" type="button">Use a sample picture</button></div>
    </section>
    <section class="w-card w-glass panel" data-panel="quick" data-panel-label="Quick filters">
      <h2>Quick filters</h2>
      <div class="grid2">
        <button class="w-button" data-variant="outline" type="button" data-quick="grayscale">Grayscale</button>
        <button class="w-button" data-variant="outline" type="button" data-quick="sepia">Sepia</button>
        <button class="w-button" data-variant="outline" type="button" data-quick="invert">Invert</button>
        <button class="w-button" data-variant="outline" type="button" data-quick="sobel">Edge detect</button>
      </div>
    </section>
    <section class="w-card w-glass panel" data-panel="adjust" data-panel-label="Adjust">
      <h2>Adjust</h2>
      <div class="w-field">
        <label class="w-label" for="tool">Tool</label>
        <select class="w-input" id="tool">
          <option value="bc">Brightness and contrast</option>
          <option value="gauss">Gaussian blur</option>
          <option value="box">Box blur</option>
          <option value="sharpen">Sharpen</option>
          <option value="posterize">Posterize</option>
          <option value="threshold">Threshold</option>
        </select>
      </div>
      <!-- One block of sliders per tool. Each slider's data-param names the value it sets. -->
      <div class="params" data-tool="bc">
        <div class="w-field"><label class="w-label" for="p-bright">Brightness</label>
          <div class="range-row"><input id="p-bright" type="range" min="-100" max="100" value="0" data-param><output for="p-bright"></output></div></div>
        <div class="w-field"><label class="w-label" for="p-contrast">Contrast</label>
          <div class="range-row"><input id="p-contrast" type="range" min="-100" max="100" value="0" data-param><output for="p-contrast"></output></div></div>
      </div>
      <div class="params" data-tool="gauss" hidden>
        <div class="w-field"><label class="w-label" for="p-sigma">Spread (pixels)</label>
          <div class="range-row"><input id="p-sigma" type="range" min="0.5" max="40" step="0.5" value="3" data-param><output for="p-sigma"></output></div></div>
      </div>
      <div class="params" data-tool="box" hidden>
        <div class="w-field"><label class="w-label" for="p-radius">Radius (pixels)</label>
          <div class="range-row"><input id="p-radius" type="range" min="1" max="60" value="4" data-param><output for="p-radius"></output></div></div>
      </div>
      <div class="params" data-tool="sharpen" hidden>
        <div class="w-field"><label class="w-label" for="p-amount">Amount</label>
          <div class="range-row"><input id="p-amount" type="range" min="0.1" max="4" step="0.1" value="1" data-param><output for="p-amount"></output></div></div>
        <div class="w-field"><label class="w-label" for="p-edge">Edge width (pixels)</label>
          <div class="range-row"><input id="p-edge" type="range" min="0.5" max="8" step="0.5" value="1.5" data-param><output for="p-edge"></output></div></div>
      </div>
      <div class="params" data-tool="posterize" hidden>
        <div class="w-field"><label class="w-label" for="p-levels">Levels per channel</label>
          <div class="range-row"><input id="p-levels" type="range" min="2" max="16" value="4" data-param><output for="p-levels"></output></div></div>
      </div>
      <div class="params" data-tool="threshold" hidden>
        <div class="w-field"><label class="w-label" for="p-level">Cut-off</label>
          <div class="range-row"><input id="p-level" type="range" min="0" max="255" value="128" data-param><output for="p-level"></output></div></div>
      </div>
      <p class="note" id="adjustNote">Move a slider to preview. Apply keeps the change.</p>
      <div class="btnrow">
        <button class="w-button" id="apply" type="button">Apply</button>
        <button class="w-button" data-variant="outline" id="discard" type="button">Discard</button>
      </div>
    </section>
    <section class="w-card w-glass panel" data-panel="history" data-panel-label="History">
      <h2>History</h2>
      <ol class="steps" id="steps"></ol>
      <div class="btnrow">
        <button class="w-button" data-variant="outline" id="undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
        <button class="w-button" data-variant="outline" id="reset" type="button">Reset</button>
        <button class="w-button" id="save" type="button">Save image</button>
      </div>
    </section>
  </div>
  <div class="col" data-arrange-column="main">
    <section class="w-card w-glass panel view" data-panel="picture" data-panel-label="Picture">
      <div class="pending" id="pending" hidden><span class="w-badge" data-variant="secondary">Preview: not applied yet</span></div>
      <div class="stage" id="stage" aria-label="The picture. Drag to move the line between before and after.">
        <canvas class="after" id="after"></canvas>
        <canvas class="before" id="before"></canvas>
        <div class="divider"></div>
        <span class="tag l">Before</span><span class="tag r">After</span>
      </div>
      <div class="viewbar">
        <label class="w-switch-row"><input type="checkbox" role="switch" class="w-switch" id="compare" checked> Compare before and after</label>
        <input class="split-range" id="split" type="range" min="0" max="100" value="50" aria-label="Divider position">
        <span class="info" id="info"></span>
      </div>
    </section>
    <section class="w-card w-glass panel" data-panel="histogram" data-panel-label="Histogram">
      <h2>Histogram</h2>
      <canvas class="hist" id="hist" aria-label="How many pixels have each level of red, green and blue."></canvas>
      <div class="legend"><span><i style="background:#ef4444"></i>Red</span><span><i style="background:#22c55e"></i>Green</span><span><i style="background:#3b82f6"></i>Blue</span><span id="histNote"></span></div>
    </section>
  </div>
</main>
<script src="ui/toast.js"></script>
<script src="ui/arrange.js"></script>
<script type="module" src="./app.js"></script>
</html>
