<h2>Result</h2>
<div class="w-field find" id="findBox" hidden>
  <label class="w-label" for="find">Find in results</label>
  <input class="w-input" type="search" id="find" spellcheck="false" placeholder="For example: checkout status=500 duration_ms>800">
  <p class="w-hint" id="findHint">Words keep rows that contain them anywhere. Use column=text, column!=text, or column&gt;number (also &lt;, &gt;=, &lt;=) to look in one column. Put spaces inside "quotes".</p>
</div>
<div id="out"><p class="empty">No table yet. Run a search.</p></div>
<div class="pager" id="pager" hidden>
  <button class="w-button" data-variant="outline" data-size="sm" id="prev" type="button">Previous</button>
  <span id="pageInfo" role="status"></span>
  <button class="w-button" data-variant="outline" data-size="sm" id="next" type="button">Next</button>
</div>
