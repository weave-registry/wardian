services:
  host:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      GDRIVE_FOLDER_ID: "${GDRIVE_FOLDER_ID}"     # the Drive folder that contains one subfolder per app
      GDRIVE_SA_KEY: /run/secrets/gdrive_sa
      REFRESH_SECS: "60"
    secrets: [gdrive_sa]
    read_only: true
    mem_limit: 256m

secrets:
  gdrive_sa:
    file: ./service-account.json    # keep out of git
