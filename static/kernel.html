<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wardian suite</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  .suite {
    max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 40px) 72px;
    display: grid; grid-template-columns: var(--suite-columns, minmax(280px, 340px) minmax(0, 1fr)); gap: 0 44px;
  }
  .suite iframe { display: block; width: 100%; height: 0; border: 0; }
  .hdr { grid-column: 1 / -1; }
  /* The sticky, scrolling input column, rebuilt around the frame. */
  .aside { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto;
           scrollbar-gutter: stable; padding-right: 12px; margin-right: -12px; }
  .headless { display: none; }
  @media (max-width: 960px) {
    .suite { grid-template-columns: minmax(0, 1fr); }
    .aside { position: static; max-height: none; overflow: visible; margin-bottom: 34px; }
  }
  #faults {
    position: fixed; left: 12px; bottom: 12px; max-width: min(40rem, calc(100vw - 24px)); max-height: 30vh; overflow: auto;
    background: #fff4f4; color: #8a1c1c; border: 1px solid #e5b4b4; border-radius: 8px; padding: .5rem .75rem;
    font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  }
  #faults[hidden] { display: none; }
  #error { padding: 2rem; color: #b33; }
  /* Arrange (/ui/arrange.js): each viewer's own layout. */
  .aside, .main { display: flex; flex-direction: column; min-width: 0; }
  .aside[hidden] { display: none; }
  .w-arrange-one .aside { position: static; max-height: none; overflow: visible; margin-bottom: 34px; }
  .w-arrange-on .panel { margin-bottom: 10px; }
</style>
<div class="suite" id="suite"></div>
<div id="faults" hidden></div>
<script src="/state.js"></script>
<script src="/channels.js"></script>
<script src="/ui/arrange.js" data-manual></script>
<script>
/* Host kernel: runs the apps of one suite, each in its own sandboxed frame.
   - Contracts come from suite.json. An app's own code cannot widen them.
   - Apps never touch each other. Messages, calls and results pass through here, copied by postMessage.
   - Retained topics are replayed to apps that start listening late.
   - Calls to a method whose app has not started yet wait for it (up to 15 s) instead of failing.
   - Capabilities are granted here: storage (kept per app), asset (files from this package),
     claude:downloads (a file download), splunk (searches the server runs, as background jobs the
     kernel waits on: ADR-2610072118), db (the package's own
     SQLite database, ADR-2610071219) and claude:sample (Claude,
     with the server's Anthropic key). The user allows splunk and Claude once per package first.
   - Channels to other packages (channels.js): only those declared in suite.json, and only once the
     user allows them. Other packages see this suite's name as the sender.
   Debug in the console: Kernel.apps(), Kernel.trace(), Kernel.faults(), Kernel.started(). */
(async () => {
  'use strict';
  const suiteName = decodeURIComponent(location.pathname.split('/')[2] || '');
  const enc = encodeURIComponent;
  const frames = new Map();            // app -> {win, el, contract, provided:Set, slot}
  const byWin = new Map();             // frame window -> app ('' for the header)
  const listeners = new Map();         // topic -> Set(app)
  const retained = new Map();          // topic -> latest payload
  const pendingCalls = new Map();      // host call id -> {from, id, to}
  const waiting = new Map();           // "app.method" -> [queued call]
  const trace = [], faults = [], started = new Set();
  let nextId = 1, headerEl = null;

  const note = (kind, app, what) => { trace.push({t: Math.round(performance.now()), kind, app, what}); if (trace.length > 400) trace.shift(); };
  function fault(app, message){
    faults.push({app, message});
    console.error('[' + app + ']', message);
    const box = document.getElementById('faults');
    box.hidden = false;
    // A fault that repeats shows once, with a count (ADR-2610071110).
    const lines = new Map();
    for (const f of faults){ const t = f.app + ': ' + f.message; lines.set(t, (lines.get(t) || 0) + 1); }
    box.textContent = [...lines].slice(-8).map(([t, n]) => n > 1 ? t + ' ×' + n : t).join('\n');
  }
  const send = (app, m) => { const f = frames.get(app); if (f) f.win.postMessage(m, '*'); };
  const reply = (app, id, ok, valueOrError) => send(app, ok ? {k: 'reply', id, ok, value: valueOrError} : {k: 'reply', id, ok, error: valueOrError});

  // ---------- load and check suite.json ----------
  let suite;
  try {
    const r = await fetch(`/apps/${enc(suiteName)}/suite.json`, {cache: 'no-store'});
    if (!r.ok) throw new Error(`suite.json: ${r.status}`);
    suite = await r.json();
    if (!Array.isArray(suite.apps)) throw new Error('suite.json needs an "apps" list');
    const FORMAT = 2;   // the newest suite.json format this kernel understands (SPEC.md)
    if ((suite.format ?? 1) > FORMAT) throw new Error(`it needs package format ${suite.format}; this Wardian reads format ${FORMAT}`);
  } catch (e) {
    const p = Object.assign(document.createElement('p'), {id: 'error', textContent: 'Cannot start this suite: ' + e.message});
    document.getElementById('suite').replaceChildren(p);
    return;
  }
  document.title = suite.title || suiteName;
  const list = v => Array.isArray(v) ? v.filter(x => typeof x === 'string') : [];
  const contractOf = a => ({
    emits: Object.fromEntries(Object.entries(a.emits || {}).map(([k, v]) => [k, {retain: !!(v && v.retain)}])),
    listens: list(a.listens), provides: list(a.provides), needs: list(a.needs), caps: list(a.caps),
    channels: {send: list(a.channels && a.channels.send), receive: list(a.channels && a.channels.receive)},
  });
  WardianChannels.setPrompt(WardianChannels.promptBar(document.body));

  // ---------- per-app storage, kept by the host for this viewer ----------
  // Kept by the Wardian server in its data folder, with a copy in this browser (state.js,
  // ADR-2610071055). Loaded once, before any app starts, so every app boots with its data.
  let stored = {};
  function loadStore(app){ return structuredClone(stored[app] || {}); }
  function saveStore(app, key, value){
    const all = stored[app] = stored[app] || {};
    if (value === undefined || value === null) delete all[key]; else all[key] = value;
    WardianState.apps.save(suiteName, app, key, value, all);
  }

  // ---------- capabilities the host can grant ----------
  const CAPS = {
    downloads: {
      async save(args){
        const {filename, data} = args || {};
        if (typeof filename !== 'string' || !/^[\w.\- ]{1,120}$/.test(filename)) throw new Error('bad file name');
        if (!(typeof data === 'string' || data instanceof Blob || ArrayBuffer.isView(data) || data instanceof ArrayBuffer)) throw new Error('data must be text or bytes');
        const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
        const a = Object.assign(document.createElement('a'), {href: url, download: filename});
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return {status: 'saved'};
      },
    },
    // splunk: the server runs the search with its own Splunk account. The app never sees the
    // address or the credentials. The user is asked once per package, like a channel, and the
    // server checks that answer again.
    splunk: {
      async status(){ return {ready: !!((await hostStatus()).splunk || {}).ready}; },
      async search(args, app){
        const {search, earliest = '', latest = ''} = args || {};
        if (typeof search !== 'string' || !search.trim()) throw new Error('the search is empty');
        if (![earliest, latest].every(t => typeof t === 'string' && t.length <= 64)) throw new Error('bad time range');
        return runJob('/api/splunk/search', 'splunk', app, {search, earliest, latest})
          .catch(e => { throw new Error(String(e.message).replace(/^not_granted: you did not allow this app to use splunk$/, 'you did not allow this app to run Splunk searches')); });
      },
      // Background jobs (ADR-2610072118): this package's recent jobs, newest first, and waiting on
      // or cancelling one, so an app opened again can pick up a load it started earlier.
      async jobs(args, app){ return (await hostGet('/api/jobs?package=' + enc(suiteName))).jobs; },
      async wait(args, app){ return waitJob(jobId(args)); },
      async cancel(args, app){ return hostPost('/api/jobs/' + enc(jobId(args)) + '/cancel', '', app, {}); },
    },
    // db: the package's own SQLite database, kept by the server (ADR-2610071219). No question for
    // its own tables; reading another package's tables asks the user once ("tables.<package>"),
    // and loading a Splunk search into a table needs the splunk permission. The server checks again.
    db: {
      async query(args, app){ const {sql, params = []} = args || {}; return hostPost('/api/db/query', '', app, {sql, params}); },
      async page(args, app){ return hostPost('/api/db/page', '', app, pageArgs(args)); },
      async readPage(args, app){
        const a = args || {};
        if (typeof a.package !== 'string' || !a.package) throw new Error('readPage needs the package that owns the table');
        if (a.package === suiteName) return hostPost('/api/db/page', '', app, pageArgs(a));
        return hostPost('/api/db/page', 'tables.' + a.package, app, Object.assign(pageArgs(a), {source: a.package}))
          .catch(e => { throw new Error(String(e.message).replace(/^not_granted: you did not allow this app to use tables\.(.+)$/, 'you did not allow this app to read the tables of $1')); });
      },
      async insertRows(args, app){ const {table, columns, rows, create = false, replace = false} = args || {}; return hostPost('/api/db/insert', '', app, {table, columns, rows, create, replace}); },
      async tables(args, app){ return (await hostPost('/api/db/tables', '', app, {})).tables; },
      async searchInto(args, app){
        const {search, earliest = '', latest = '', table = 'search'} = args || {};
        if (typeof search !== 'string' || !search.trim()) throw new Error('the search is empty');
        return runJob('/api/db/search-into', 'splunk', app, {search, earliest, latest, table})
          .catch(e => { throw new Error(String(e.message).replace(/^not_granted: you did not allow this app to use splunk$/, 'you did not allow this app to run Splunk searches')); });
      },
    },
    // claude:sample: Claude, through the provider set up in Settings (Anthropic API or Amazon
    // Bedrock). Offered only when one is ready; the user allows each package once (asked as "ai"),
    // and the server checks that again.
    // Errors start with a code ("rate_limited: …") that the frame turns into e.code.
    sample: {
      async text(args, app){ return runJob('/api/ai/sample', 'ai', app, {prompt: (args || {}).prompt, tier: (args || {}).tier, json: false}); },
      async json(args, app){ return (await runJob('/api/ai/sample', 'ai', app, {prompt: (args || {}).prompt, tier: (args || {}).tier, json: true})).value; },
    },
  };
  async function hostStatus(){
    const r = await fetch('/api/status', {cache: 'no-store'});
    return r.json();
  }
  const pageArgs = a => { const {table, offset = 0, limit = 100, orderBy = '', desc = false, where = '', params = []} = a || {}; return {table, offset, limit, orderBy, desc, where, params}; };
  // A call to this server for an app, after the user allowed `grant` for this package (none needed
  // when `grant` is empty).
  async function hostPost(path, grant, app, body){
    if (grant && !(await WardianChannels.permit(suiteName, grant))) throw new Error('not_granted: you did not allow this app to use ' + (grant === 'ai' ? 'Claude' : grant));
    const headers = {'Content-Type': 'application/json'};
    try { const t = sessionStorage.getItem('adminToken'); if (t) headers['X-Admin-Token'] = t; } catch { /* blocked */ }
    const r = await fetch(path, {method: 'POST', headers, body: JSON.stringify(Object.assign({package: suiteName, app}, body))});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
    return j;
  }
  // ---------- long calls run as background jobs (ADR-2610072118) ----------
  // A Splunk search, a load into a table, or a question to Claude can take minutes. The server runs it
  // as a job and answers at once; the kernel asks how it is going with short requests (every second
  // at first, then every two), so no connection stays held and other pages keep loading.
  // The app still gets one promise, which settles with the job's result (and its id, as `job`).
  async function hostGet(path){
    const headers = {};
    try { const t = sessionStorage.getItem('adminToken'); if (t) headers['X-Admin-Token'] = t; } catch { /* blocked */ }
    const r = await fetch(path, {headers, cache: 'no-store'});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
    return j;
  }
  const jobId = a => { const id = typeof a === 'string' ? a : a && a.id; if (typeof id !== 'string' || !/^[\w-]{1,64}$/.test(id)) throw new Error('which job? give its id'); return id; };
  async function runJob(path, grant, app, body){
    const {job} = await hostPost(path, grant, app, Object.assign({}, body, {background: true}));
    return waitJob(job);
  }
  async function waitJob(id){
    const t0 = Date.now();
    let misses = 0;
    for (let first = true; ; first = false){
      const since = Date.now() - t0;
      await new Promise(r => setTimeout(r, first ? 250 : since < 10000 ? 1000 : 2000));
      let j;
      try { j = await hostGet('/api/jobs/' + enc(id) + '?package=' + enc(suiteName)); misses = 0; }
      catch (e) { if (/^no job/.test(e.message) || ++misses > 5) throw e; continue; }   // a blip: ask again
      if (j.state === 'done') return (j.result && typeof j.result === 'object' && !Array.isArray(j.result)) ? Object.assign({}, j.result, {job: id}) : j.result;
      if (j.state === 'failed') throw new Error(j.error || 'the job failed');
      if (j.state === 'cancelled') throw new Error('cancelled');
    }
  }
  // Capabilities this host provides under their own name (not "claude:…").
  const HOST_CAPS = ['splunk', 'db'];
  const capDeclared = (app, name) => frames.get(app).contract.caps.includes(HOST_CAPS.includes(name) ? name : 'claude:' + name);

  // ---------- message handling ----------
  function deliver(app, topic){
    if (retained.has(topic)) send(app, {k: 'msg', topic, payload: retained.get(topic)});
  }
  function forwardCall(c){
    const id = nextId++;
    pendingCalls.set(id, {from: c.from, id: c.id, to: c.app});
    note('call', c.from, c.app + '.' + c.method);
    send(c.app, {k: 'invoke', id, method: c.method, args: c.args});
  }

  const handlers = {
    hello(app){
      const f = frames.get(app); if (!f) return;
      started.add(app);
      send(app, {k: 'boot', contract: f.contract, store: f.contract.caps.includes('storage') ? loadStore(app) : {}});
      note('boot', app, 'ok');
    },
    emit(app, m){
      const f = frames.get(app);
      if (!f.contract.emits[m.topic]) return fault(app, `may not emit "${m.topic}" (not in suite.json)`);
      if (f.contract.emits[m.topic].retain) retained.set(m.topic, m.payload);
      note('emit', app, m.topic);
      (listeners.get(m.topic) || new Set()).forEach(to => send(to, {k: 'msg', topic: m.topic, payload: m.payload}));
    },
    on(app, m){
      if (!frames.get(app).contract.listens.includes(m.topic)) return fault(app, `may not listen to "${m.topic}" (not in suite.json)`);
      if (!listeners.has(m.topic)) listeners.set(m.topic, new Set());
      listeners.get(m.topic).add(app);
      deliver(app, m.topic);
    },
    provide(app, m){
      const f = frames.get(app);
      for (const method of list(m.methods)){
        if (!f.contract.provides.includes(method)){ fault(app, `may not provide "${method}" (not in suite.json)`); continue; }
        f.provided.add(method);
        const key = app + '.' + method;
        (waiting.get(key) || []).forEach(c => { clearTimeout(c.timer); forwardCall(c); });
        waiting.delete(key);
      }
    },
    call(app, m){
      const key = m.app + '.' + m.method;
      if (!frames.get(app).contract.needs.includes(key)) return reply(app, m.id, false, `${app} may not call "${key}" (not in suite.json)`);
      const target = frames.get(m.app);
      if (!target || !target.contract.provides.includes(m.method)) return reply(app, m.id, false, key + ' is not available');
      const c = {from: app, id: m.id, app: m.app, method: m.method, args: m.args};
      if (target.provided.has(m.method)) return forwardCall(c);
      // The provider's frame has not started yet: hold the call until it does.
      c.timer = setTimeout(() => {
        waiting.set(key, (waiting.get(key) || []).filter(x => x !== c));
        reply(app, m.id, false, key + ' did not start in time');
      }, 15000);
      if (!waiting.has(key)) waiting.set(key, []);
      waiting.get(key).push(c);
    },
    result(app, m){
      const p = pendingCalls.get(m.id);
      if (!p || p.to !== app) return;   // only the app that was asked may answer
      pendingCalls.delete(m.id);
      reply(p.from, p.id, !!m.ok, m.ok ? m.value : String(m.error));
    },
    store(app, m){
      if (!frames.get(app).contract.caps.includes('storage')) return fault(app, 'did not declare capability "storage"');
      if (typeof m.key === 'string') saveStore(app, m.key, m.value);
    },
    async cap(app, m){
      let impl = capDeclared(app, m.name) && CAPS[m.name];
      // Offer Claude only when this server has a key, so apps hide AI features otherwise.
      if (impl && m.name === 'sample'){ try { if (!(await hostStatus()).ai.ready) impl = null; } catch { impl = null; } }
      note('cap', app, m.name + (impl ? '' : ' (not available)'));
      reply(app, m.id, true, impl ? Object.keys(impl) : null);
    },
    async capop(app, m){
      const impl = capDeclared(app, m.name) && CAPS[m.name];
      if (!impl || !Object.hasOwn(impl, m.op) || typeof impl[m.op] !== 'function') return reply(app, m.id, false, `capability ${m.name}.${m.op} is not granted`);
      note('capop', app, m.name + '.' + m.op);
      try { reply(app, m.id, true, await impl[m.op](m.args, app)); }
      catch (e) { reply(app, m.id, false, String(e && e.message || e)); }
    },
    async asset(app, m){
      if (!frames.get(app).contract.caps.includes('asset')) return reply(app, m.id, false, 'did not declare capability "asset"');
      const path = String(m.path || '');
      if (!/^[A-Za-z0-9_-][A-Za-z0-9_.-]*(\/[A-Za-z0-9_-][A-Za-z0-9_.-]*)*$/.test(path)) return reply(app, m.id, false, 'bad asset path: ' + path);
      note('asset', app, path);
      try {
        const r = await fetch(`/apps/${enc(suiteName)}/${path}`, {cache: 'no-cache'});
        if (!r.ok) throw new Error(`${path}: ${r.status}`);
        reply(app, m.id, true, await r.arrayBuffer());
      } catch (e) { reply(app, m.id, false, String(e && e.message || e)); }
    },
    async chsend(app, m){
      if (!frames.get(app).contract.channels.send.includes(m.channel)) return reply(app, m.id, false, `may not send on channel "${m.channel}" (not in suite.json)`);
      note('channel', app, 'send ' + m.channel);
      try { await WardianChannels.send(suiteName, m.channel, m.data); reply(app, m.id, true, null); }
      catch (e) { reply(app, m.id, false, String(e && e.message || e)); }
    },
    async chon(app, m){
      if (!frames.get(app).contract.channels.receive.includes(m.channel)) return reply(app, m.id, false, `may not receive on channel "${m.channel}" (not in suite.json)`);
      note('channel', app, 'receive ' + m.channel);
      try {
        await WardianChannels.receive(suiteName, m.channel, (data, info) => send(app, {k: 'chmsg', channel: m.channel, data, from: info.from, at: info.at}));
        reply(app, m.id, true, null);
      } catch (e) { reply(app, m.id, false, String(e && e.message || e)); }
    },
    fault(app, m){ fault(app, String(m.message)); },
  };

  addEventListener('message', e => {
    if (!byWin.has(e.source)) return;          // only our own frames are heard
    const app = byWin.get(e.source), m = e.data || {};
    const f = app ? frames.get(app) : null;
    if (m.k === 'size'){
      const el = app ? f.el : headerEl;
      el.style.height = (m.h | 0) + 'px';
      // Follow the latest color, not the first: a frame can report before its
      // dark-mode styles apply, and the theme can change while the page is open.
      if (m.bg && m.bg !== 'rgba(0, 0, 0, 0)') document.body.style.background = m.bg;
      return;
    }
    if (!app) return;                          // the header frame only reports its size
    const h = handlers[m.k];
    if (h) h(app, m); else fault(app, 'unknown message: ' + String(m.k));
  });

  stored = await WardianState.apps.load(suiteName);

  // ---------- layout ----------
  const grid = document.getElementById('suite');
  // A variable, not an inline grid style, so the narrow-screen rule can still switch to one column.
  if (suite.columns && /^[\w\s(),.%-]+$/.test(suite.columns)) grid.style.setProperty('--suite-columns', suite.columns);
  const SANDBOX = 'allow-scripts allow-forms allow-modals allow-popups allow-downloads';
  function frameEl(src, title){
    const el = document.createElement('iframe');
    el.setAttribute('sandbox', SANDBOX);
    el.title = title; el.src = src;
    return el;
  }
  if (suite.header){
    headerEl = frameEl(`/frame/${enc(suiteName)}/`, 'header');
    const box = Object.assign(document.createElement('div'), {className: 'hdr'});
    box.append(headerEl); grid.append(box);
  }
  const aside = Object.assign(document.createElement('div'), {className: 'aside'});
  const main = Object.assign(document.createElement('div'), {className: 'main'});
  const hidden = Object.assign(document.createElement('div'), {className: 'headless'});
  grid.append(aside, main);
  document.body.append(hidden);
  if (headerEl) byWin.set(headerEl.contentWindow, '');

  // Each viewer may arrange the panels (Arrange, /ui/arrange.js): which column, what order, which
  // are hidden. Kept in this browser only; the package never changes. Apps without a slot have no panel.
  const panels = [];
  for (const a of suite.apps){
    if (!a || typeof a.name !== 'string' || !/^[\w.-]+$/.test(a.name) || frames.has(a.name)){ fault('kernel', 'bad or duplicate app entry in suite.json'); continue; }
    const el = frameEl(`/frame/${enc(suiteName)}/${enc(a.name)}`, a.name);
    if (a.slot === 'aside' || a.slot === 'main'){
      const wrap = Object.assign(document.createElement('div'), {className: 'panel'});
      wrap.append(el);
      panels.push({id: a.name, el: wrap, home: a.slot});
    } else hidden.append(el);
    frames.set(a.name, {win: null, el, contract: contractOf(a), provided: new Set(), slot: a.slot || null});
  }
  let again = false;
  try { again = sessionStorage.getItem('wardian-arranging') === suiteName; sessionStorage.removeItem('wardian-arranging'); } catch {}
  // The panels are not in the page yet, so the saved layout places them without restarting anything.
  const arranged = await WardianArrange.init({
    columns: [{id: 'aside', el: aside, label: 'Side'}, {id: 'main', el: main, label: 'Main'}],
    panels, grid,
    load: () => WardianState.layout.load(suiteName),
    save: l => WardianState.layout.save(suiteName, l),
    // moveBefore keeps a frame running; without it, moving a frame restarts its app, so reload instead.
    canMoveLive: !!Element.prototype.moveBefore,
    reload: () => { try { sessionStorage.setItem('wardian-arranging', suiteName); } catch {} location.reload(); },
    startOpen: again,
  });
  if (!arranged){ for (const p of panels) (p.home === 'aside' ? aside : main).append(p.el); }
  if (!aside.children.length) aside.hidden = true;
  // A frame has a window only once it is in the page, so the kernel learns the windows now.
  for (const [n, f] of frames){ f.win = f.el.contentWindow; byWin.set(f.win, n); }

  window.Kernel = Object.freeze({
    apps: () => suite.apps.map(a => Object.assign({name: a.name}, contractOf(a))),
    trace: () => trace.slice(),
    faults: () => faults.slice(),
    started: () => [...started],
  });
})();
</script>
</html>
