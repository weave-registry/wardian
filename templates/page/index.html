<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<style>
  :root { color-scheme: light dark; --ink: #1b1f24; --muted: #667080; --line: #d5dae0; --bg: #fff; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6e8eb; --muted: #949ca8; --line: #2e343c; --bg: #16191d; --accent: #6d9cf2; } }
  body { margin: 0; padding: 1.5rem; font: 16px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
  p { margin: .25rem 0 1rem; color: var(--muted); }
  textarea { width: 100%; min-height: 7rem; box-sizing: border-box; padding: .6rem; font: inherit; color: inherit;
             background: transparent; border: 1px solid var(--line); border-radius: 8px; }
  output { display: block; margin-top: 1rem; padding: .75rem; border-left: 3px solid var(--accent); white-space: pre-wrap; }
</style>
<h1>{{name}}</h1>
<p>Type below. WebAssembly counts the words and shouts the text back.</p>
<textarea id="text" aria-label="Text">hello from rustle</textarea>
<output id="out" aria-live="polite"></output>
<script type="module" src="./app.js"></script>
</html>
