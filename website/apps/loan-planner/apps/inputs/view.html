<h2>Your loan</h2>
<form id="form" novalidate>
  <div class="w-field"><label class="w-label" for="amount">Amount borrowed</label><input class="w-input" id="amount" type="number" min="1" step="1000" inputmode="decimal"></div>
  <div class="w-field"><label class="w-label" for="rate">Interest rate (% a year)</label><input class="w-input" id="rate" type="number" min="0" max="50" step="0.05" inputmode="decimal"></div>
  <div class="w-field"><label class="w-label" for="years">Term (years)</label><input class="w-input" id="years" type="number" min="1" max="50" step="1" inputmode="numeric"></div>
  <div class="w-field"><label class="w-label" for="extra">Extra payment each month</label><input class="w-input" id="extra" type="number" min="0" step="50" inputmode="decimal"></div>
  <div class="two">
    <div class="w-field"><label class="w-label" for="start">First payment</label><input class="w-input" id="start" type="month"></div>
    <div class="w-field"><label class="w-label" for="currency">Currency</label>
      <select class="w-input" id="currency">
        <option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option>
        <option>AUD</option><option>CHF</option><option>JPY</option><option>INR</option>
      </select></div>
  </div>
</form>
<p class="note" id="problem" role="alert"></p>
<p class="w-hint">Saved in this browser for next time.</p>
